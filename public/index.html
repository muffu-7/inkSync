<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport configuration for proper mobile display and touch handling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>InkSync - S-Pen Drawing App</title>
    <style>
        /* Global reset and viewport fixing for mobile */
        html, body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background: #f0f0f0;
            /* Prevent overscroll bounce and enable proper touch handling */
            overscroll-behavior: none;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            /* Disable text selection for better drawing experience */
            -webkit-user-select: none;
            user-select: none;
        }

        /* Full-viewport canvas container */
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            /* Disable default touch behaviors */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        /* Drawing canvas configuration */
        canvas { 
            touch-action: none;
            -ms-touch-action: none;
            background: white;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Set transform origin for proper zooming */
            transform-origin: 0 0;
            will-change: transform;
        }

        /* Connection status indicator */
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
        }

        /* Bottom toolbar styling */
        .toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        /* Toolbar button styles */
        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #444;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
            transition: all 0.2s;
        }

        /* Active tool indicator */
        .toolbar button.active {
            background: #0066ff;
        }

        /* Button hover effect */
        .toolbar button:hover {
            opacity: 0.9;
        }

        /* Disabled button state */
        .toolbar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #666;
        }

        /* Eraser size control container */
        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
        }

        /* Size slider styling */
        .size-control input[type="range"] {
            width: 100px;
            accent-color: #0066ff;
        }

        /* Size value display */
        .size-control .size-value {
            min-width: 30px;
            text-align: right;
        }

        /* Hide size control when pen tool is active */
        .size-control.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Main canvas container -->
    <div class="canvas-container">
        <canvas id="drawingCanvas"></canvas>
    </div>
    <!-- WebSocket connection status indicator -->
    <div id="status" class="status">Disconnected</div>
    <!-- Main application script -->
    <script type="module" src="app.js"></script>
</body>
</html>
