<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>InkSync - S-Pen Drawing App</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            background: #f0f0f0;
            overscroll-behavior: none;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            -webkit-user-select: none;
            user-select: none;
        }
        .canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }
        canvas { 
            touch-action: none;
            background: white;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 12px;
        }
        .toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background: #444;
            color: white;
            cursor: pointer;
            font-family: sans-serif;
            transition: all 0.2s;
        }
        .toolbar button.active {
            background: #0066ff;
        }
        .toolbar button:hover {
            opacity: 0.9;
        }
        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-family: sans-serif;
            font-size: 12px;
        }
        .size-control input[type="range"] {
            width: 100px;
            accent-color: #0066ff;
        }
        .size-control .size-value {
            min-width: 30px;
            text-align: right;
        }
        /* Hide size control when pen is active */
        .size-control.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <canvas id="drawingCanvas"></canvas>
    </div>
    <div id="status" class="status">Disconnected</div>
    <script src="app.js"></script>
</body>
</html>
